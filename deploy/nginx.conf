# setup-server.sh 会把 __AIRVANA_DOMAIN__ 替换为真实域名；暂无域名时用 _。
#
# 前后端分离部署：静态资源由 nginx 直接发，Node 只处理 /api。
# 对应地，服务端要设置 SERVE_STATIC=false（见 deploy/.env.example），
# 这样前端发版不必重启 API，API 重启也不影响静态资源。
server {
    listen 80;
    listen [::]:80;
    server_name __AIRVANA_DOMAIN__;
    server_tokens off;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Web 前端与全部静态资源（含 arcade 游戏包）。
    root /opt/airvana/current/public;
    index index.html;

    # 桌面工作台保留原来的无扩展名入口。
    location = /workspace {
        try_files /workspace.html =404;
    }

    # 带内容指纹的静态资源可以长缓存；HTML 不缓存，保证发版即时生效。
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|webp|gif|svg|woff2?|ttf|mp3|mp4|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 只有 /api 走 Node。
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 这三条非 API 路由仍由 Node 输出：/content 与 /preview 带 CSP 与同源限制，
    # /l 是分享短链跳转。静态托管关掉后它们依然有效。
    location ~ ^/(content|preview|l)/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
