<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07120d" />
  <title>Fruit Slash · 手势切水果</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="gameShell">
    <canvas id="gameCanvas" aria-label="切水果游戏画面"></canvas>

    <section id="menu" class="overlay menu">
      <div class="brand-mark">FS</div>
      <p class="eyebrow">CAMERA GESTURE GAME</p>
      <h1>FRUIT<br><span>SLASH</span></h1>
      <p class="intro">伸出食指，快速划过水果</p>
      <div class="how-to">
        <span><b>☝️</b> 食指切割</span>
        <span><b>🍉</b> 连切加分</span>
        <span><b>💣</b> 避开炸弹</span>
      </div>
      <div class="menu-poster"><button id="startButton" class="primary-button">开始游戏</button></div>
      <p class="fallback-note">无摄像头时可直接触屏滑动</p>
    </section>

    <header id="hud" class="hud" hidden>
      <div class="score-block"><small>SCORE</small><strong id="score">0</strong></div>
      <div class="timer"><span id="time">45</span><small>SEC</small></div>
      <div id="lives" class="lives" aria-label="3 条生命">● ● ●</div>
    </header>

    <aside id="cameraPanel" class="camera-panel" hidden>
      <video id="cameraVideo" autoplay muted playsinline></video>
      <button id="cameraFallback" type="button">
        <span class="camera-icon"></span>
        <strong>开启摄像头</strong>
      </button>
      <div id="trackingStatus" class="tracking-status">等待摄像头</div>
    </aside>

    <div id="combo" class="combo" aria-live="polite"></div>
    <div id="toast" class="toast" role="status"></div>

    <section id="gameOver" class="overlay result" hidden>
      <p class="eyebrow">ROUND COMPLETE</p>
      <h2>游戏结束</h2>
      <div class="final-score"><span id="finalScore">0</span><small>本局得分</small></div>
      <div class="result-row"><span>最高分 <b id="bestScore">0</b></span><span>最高连击 <b id="bestCombo">0</b></span></div>
      <button id="restartButton" class="primary-button">再玩一次</button>
      <button id="homeButton" class="text-button">返回首页</button>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
