<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0722"/>
      <stop offset="0.45" stop-color="#3c1147"/>
      <stop offset="0.72" stop-color="#4d1a4e"/>
      <stop offset="1" stop-color="#24092c"/>
    </linearGradient>
    <radialGradient id="ceil" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffb14d" stop-opacity="0.4"/>
      <stop offset="0.4" stop-color="#ff7c3a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7c3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#c2481f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c2481f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="0.5" stop-color="#ffd23e"/>
      <stop offset="1" stop-color="#e8930f"/>
    </linearGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c07812"/>
      <stop offset="1" stop-color="#8a5208"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5546"/>
      <stop offset="1" stop-color="#cf1f1a"/>
    </linearGradient>
    <linearGradient id="screenL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57e6ff"/>
      <stop offset="1" stop-color="#1c74c9"/>
    </linearGradient>
    <linearGradient id="screenR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8ade"/>
      <stop offset="1" stop-color="#a233c9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <g id="coin">
      <ellipse cx="0" cy="6" rx="34" ry="32" fill="url(#coinEdge)"/>
      <circle cx="0" cy="0" r="34" fill="url(#coinFace)"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#c07812" stroke-width="4"/>
      <text x="0" y="11" font-family="Arial Black, Arial" font-size="32" font-weight="900" fill="#a96a0e" text-anchor="middle">¥</text>
      <path d="M -20 -22 A 30 30 0 0 1 8 -32" stroke="#fff8cf" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
    </g>
    <g id="redpacket">
      <rect x="-34" y="-48" width="68" height="96" rx="10" fill="url(#packet)" stroke="#8f120e" stroke-width="3"/>
      <path d="M -34 -30 Q 0 4 34 -30 L 34 -38 Q 0 -4 -34 -38 Z" fill="#a81511"/>
      <circle cx="0" cy="-16" r="15" fill="#ffd23e" stroke="#c07812" stroke-width="3"/>
      <text x="0" y="-9" font-family="Arial" font-size="18" font-weight="900" fill="#a3540a" text-anchor="middle">福</text>
    </g>
    <g id="sparkle">
      <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="#ffe98a"/>
    </g>
    <g id="cabinet">
      <path d="M -70 -160 L 70 -160 L 84 170 L -84 170 Z" fill="#230b2e"/>
      <rect x="-58" y="-150" width="116" height="26" rx="8" fill="#341040"/>
      <rect x="-52" y="-112" width="104" height="86" rx="10" fill="#160619"/>
    </g>
  </defs>

  <rect width="1000" height="1400" fill="url(#hall)"/>
  <rect width="1000" height="1400" fill="url(#ceil)"/>

  <!-- 远景机台剪影 -->
  <g opacity="0.9">
    <g transform="translate(96 560) scale(1.06)">
      <use href="#cabinet"/>
      <rect x="-52" y="-112" width="104" height="86" rx="10" fill="url(#screenL)" opacity="0.8" filter="url(#glow)"/>
      <circle cx="-24" cy="6" r="9" fill="#ff5546"/><circle cx="4" cy="6" r="9" fill="#ffd23e"/>
    </g>
    <g transform="translate(906 596) scale(1.12)">
      <use href="#cabinet"/>
      <rect x="-52" y="-112" width="104" height="86" rx="10" fill="url(#screenR)" opacity="0.8" filter="url(#glow)"/>
      <circle cx="-24" cy="6" r="9" fill="#57e6ff"/><circle cx="4" cy="6" r="9" fill="#ffd23e"/>
    </g>
  </g>

  <!-- 地板：透视网格 + 暖光 -->
  <g>
    <rect y="1010" width="1000" height="390" fill="#2b0c33"/>
    <g stroke="#7a3a8a" stroke-width="3" opacity="0.5">
      <line x1="500" y1="1010" x2="-240" y2="1400"/>
      <line x1="500" y1="1010" x2="130" y2="1400"/>
      <line x1="500" y1="1010" x2="500" y2="1400"/>
      <line x1="500" y1="1010" x2="870" y2="1400"/>
      <line x1="500" y1="1010" x2="1240" y2="1400"/>
      <line x1="0" y1="1052" x2="1000" y2="1052"/>
      <line x1="0" y1="1128" x2="1000" y2="1128"/>
      <line x1="0" y1="1252" x2="1000" y2="1252"/>
    </g>
    <rect y="990" width="1000" height="410" fill="url(#floorGlow)"/>
  </g>

  <!-- 霓虹招牌 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(128 208) rotate(-4)" stroke="#4ee1ff" stroke-width="7" filter="url(#glowBig)">
      <rect x="-92" y="-64" width="184" height="128" rx="18"/>
      <path d="M -60 18 L -30 -22 L 0 18 L 30 -22 L 60 18"/>
    </g>
    <g transform="translate(872 250) rotate(5)" stroke="#ff5ecc" stroke-width="7" filter="url(#glowBig)">
      <rect x="-84" y="-58" width="168" height="116" rx="18"/>
      <path d="M -52 14 L -22 -20 L 8 14 L 38 -20"/>
    </g>
    <g transform="translate(94 430) rotate(-8)" stroke="#ffd23e" stroke-width="6" filter="url(#glow)">
      <circle r="42"/>
      <path d="M -16 8 L 0 -20 L 16 8 Z"/>
    </g>
    <g transform="translate(922 456) rotate(7)" stroke="#7dff9e" stroke-width="6" filter="url(#glow)">
      <path d="M 0 -44 L 12 -12 L 46 -12 L 18 8 L 28 42 L 0 22 L -28 42 L -18 8 L -46 -12 L -12 -12 Z"/>
    </g>
  </g>

  <!-- 奖杯 -->
  <g transform="translate(112 806) rotate(-6) scale(1.7)" filter="url(#glow)">
    <path d="M -30 -36 Q -30 12 0 20 Q 30 12 30 -36 Z" fill="#ffcb3d" stroke="#c07812" stroke-width="3"/>
    <path d="M -30 -30 Q -52 -26 -46 -6 Q -42 8 -24 6" fill="none" stroke="#ffcb3d" stroke-width="7"/>
    <path d="M 30 -30 Q 52 -26 46 -6 Q 42 8 24 6" fill="none" stroke="#ffcb3d" stroke-width="7"/>
    <rect x="-7" y="20" width="14" height="14" fill="#e8930f"/>
    <rect x="-24" y="34" width="48" height="12" rx="4" fill="#ffcb3d" stroke="#c07812" stroke-width="3"/>
    <path d="M 0 -22 L 4 -12 L 15 -12 L 6 -5 L 9 6 L 0 -1 L -9 6 L -6 -5 L -15 -12 L -4 -12 Z" fill="#a96a0e"/>
  </g>

  <!-- 钱袋 -->
  <g transform="translate(880 1150) scale(2)" filter="url(#glow)">
    <path d="M -10 -30 Q -34 -4 -30 16 Q -22 36 0 36 Q 22 36 30 16 Q 34 -4 10 -30 Z" fill="#b5763f" stroke="#7c4a26" stroke-width="3"/>
    <path d="M -12 -28 Q 0 -22 12 -28" fill="none" stroke="#7c4a26" stroke-width="5"/>
    <rect x="-13" y="-40" width="26" height="12" rx="4" fill="#7c4a26"/>
    <text x="0" y="16" font-family="Arial Black, Arial" font-size="26" font-weight="900" fill="#ffd23e" text-anchor="middle">¥</text>
  </g>
  <g transform="translate(770 1240) scale(1.3) rotate(9)" opacity="0.9">
    <path d="M -10 -30 Q -34 -4 -30 16 Q -22 36 0 36 Q 22 36 30 16 Q 34 -4 10 -30 Z" fill="#9c6132" stroke="#6d3f1e" stroke-width="3"/>
    <rect x="-12" y="-39" width="24" height="11" rx="4" fill="#6d3f1e"/>
  </g>

  <!-- 漂浮金币 -->
  <g>
    <use href="#coin" transform="translate(64 96) scale(0.9) rotate(-18)"/>
    <use href="#coin" transform="translate(214 60) scale(0.6) rotate(14)"/>
    <use href="#coin" transform="translate(806 88) scale(0.8) rotate(20)"/>
    <use href="#coin" transform="translate(948 170) scale(0.55) rotate(-12)"/>
    <use href="#coin" transform="translate(42 330) scale(0.62) rotate(9)"/>
    <use href="#coin" transform="translate(958 350) scale(0.72) rotate(-22)"/>
    <use href="#coin" transform="translate(36 640) scale(0.78) rotate(16)"/>
    <use href="#coin" transform="translate(966 700) scale(0.92) rotate(-9)"/>
    <use href="#coin" transform="translate(60 986) scale(0.7) rotate(24)"/>
    <use href="#coin" transform="translate(940 940) scale(0.62) rotate(-16)"/>
    <use href="#coin" transform="translate(150 1290) scale(1.15) rotate(-8)"/>
    <use href="#coin" transform="translate(320 1352) scale(0.85) rotate(12)"/>
    <use href="#coin" transform="translate(686 1330) scale(0.95) rotate(-14)"/>
    <use href="#coin" transform="translate(66 1180) scale(0.8) rotate(6)"/>
  </g>
  <!-- 前景特写大金币（景深虚化） -->
  <use href="#coin" transform="translate(986 1332) scale(2.6) rotate(14)" filter="url(#soft)"/>
  <use href="#coin" transform="translate(16 1360) scale(2.1) rotate(-10)" filter="url(#soft)"/>

  <!-- 红包 -->
  <use href="#redpacket" transform="translate(66 508) rotate(-16) scale(0.9)"/>
  <use href="#redpacket" transform="translate(936 560) rotate(12) scale(0.8)"/>
  <use href="#redpacket" transform="translate(120 1080) rotate(18)"/>
  <use href="#redpacket" transform="translate(902 850) rotate(-11) scale(0.75)"/>

  <!-- 星光与彩屑 -->
  <g filter="url(#glow)">
    <use href="#sparkle" transform="translate(160 150) scale(1.1)"/>
    <use href="#sparkle" transform="translate(864 120) scale(0.8)"/>
    <use href="#sparkle" transform="translate(48 250) scale(0.7)"/>
    <use href="#sparkle" transform="translate(950 260) scale(1)"/>
    <use href="#sparkle" transform="translate(96 920) scale(0.9)"/>
    <use href="#sparkle" transform="translate(918 1040) scale(1.2)"/>
    <use href="#sparkle" transform="translate(206 1210) scale(0.8)"/>
  </g>
  <g opacity="0.85">
    <rect x="250" y="90" width="14" height="7" rx="2" fill="#ff5546" transform="rotate(24 257 93)"/>
    <rect x="742" y="64" width="14" height="7" rx="2" fill="#4ee1ff" transform="rotate(-18 749 67)"/>
    <rect x="120" y="380" width="12" height="6" rx="2" fill="#ffd23e" transform="rotate(40 126 383)"/>
    <rect x="906" y="420" width="12" height="6" rx="2" fill="#ff5ecc" transform="rotate(-30 912 423)"/>
    <rect x="60" y="760" width="13" height="6" rx="2" fill="#ffd23e" transform="rotate(15 66 763)"/>
    <rect x="930" y="790" width="13" height="6" rx="2" fill="#7dff9e" transform="rotate(-24 936 793)"/>
    <rect x="180" y="1024" width="14" height="7" rx="2" fill="#ff5546" transform="rotate(-36 187 1027)"/>
    <rect x="836" y="1120" width="14" height="7" rx="2" fill="#4ee1ff" transform="rotate(28 843 1123)"/>
  </g>
</svg>
