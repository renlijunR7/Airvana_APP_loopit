<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#071f26" />
    <meta name="description" content="一个原创的移动端观众竞猜小游戏演示：选择支持的玩家，观看牌局并赢取虚拟星币。" />
    <title>星桌竞猜</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="game-shell" id="game-shell">
      <header class="topbar">
        <div class="brand" aria-label="星桌竞猜">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span>
            <strong>星桌</strong>
            <small>STAR TABLE</small>
          </span>
        </div>

        <div class="topbar-actions">
          <button class="icon-button" id="sound-button" type="button" aria-label="关闭音效" aria-pressed="true">
            <span aria-hidden="true">♫</span>
          </button>
          <button class="balance-chip" id="balance-chip" type="button" aria-label="查看星币余额">
            <span class="coin-dot" aria-hidden="true">✦</span>
            <strong id="balance-value">10,000</strong>
          </button>
        </div>
      </header>

      <nav class="phase-track" aria-label="竞猜进度">
        <ol>
          <li data-phase="PRE_BET">
            <span>1</span>
            <small>预约</small>
          </li>
          <li data-phase="LIVE_BET">
            <span>2</span>
            <small>竞猜</small>
          </li>
          <li data-phase="PLAYING">
            <span>3</span>
            <small>观战</small>
          </li>
          <li data-phase="RESULT">
            <span>4</span>
            <small>结算</small>
          </li>
        </ol>
      </nav>

      <main id="screen" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="主要导航">
        <button class="bottom-nav-item active" type="button" data-nav="events">
          <span aria-hidden="true">⌁</span>
          <small>活动</small>
        </button>
        <button class="bottom-nav-item" type="button" data-nav="prediction">
          <span aria-hidden="true">◆</span>
          <small>竞猜</small>
        </button>
        <button class="bottom-nav-item" type="button" data-nav="history">
          <span aria-hidden="true">▥</span>
          <small>战报</small>
        </button>
      </nav>
    </div>

    <div id="modal-layer" class="modal-layer" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>请启用 JavaScript 体验竞猜小游戏。</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
