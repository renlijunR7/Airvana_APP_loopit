<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Airvana Playable Runner</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0B0A10; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    background: #0B0A10;
    border-radius: 0;
  }
  #boot-error {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #C9C9D2; font: 13px/1.6 -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 32px;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="360" height="560"></canvas></div>
<div id="boot-error"></div>
<script>
// 少数引擎（physics-art-v2、reference-screenshots-v1）用裸绝对路径引用素材。
// 引擎文件必须与 Web 源逐字节一致，所以在这里做运行时映射：
// /assets/games/… → 相对于本页的 assets/games/…（即 bundle 内 assets/runner/assets/games/）。
(function () {
  var base = new URL('./', document.baseURI).href;
  var proto = window.HTMLImageElement && window.HTMLImageElement.prototype;
  var desc = proto && Object.getOwnPropertyDescriptor(proto, 'src');
  if (!desc || !desc.set) return;
  Object.defineProperty(proto, 'src', {
    configurable: true,
    enumerable: desc.enumerable,
    get: desc.get,
    set: function (value) {
      var next = value;
      if (typeof next === 'string' && next.indexOf('/assets/games/') === 0) {
        next = base + next.slice(1);
      }
      desc.set.call(this, next);
    }
  });
})();
</script>
<script src="sensor-interactions-v1.js"></script>
<script src="game-art-system-v1.js"></script>
<script src="playable-assets-v3.js"></script>
<script src="complete-games-v3.js"></script>
<script src="deep-games-v2.js"></script>
<script src="matter-0.20.0.min.js"></script>
<script src="physics-art-v2.js"></script>
<script src="physics-sling-rope-v1.js"></script>
<script src="physics-water-v1.js"></script>
<script src="physics-fruit-v1.js"></script>
<script src="physics-arcade-v1.js"></script>
<script src="reference-action-v1.js"></script>
<script src="reference-worlds-v1.js"></script>
<script src="reference-puzzles-v1.js"></script>
<script src="reference-arcade-v1.js"></script>
<script src="reference-screenshots-v1.js"></script>
<script>
(function () {
  'use strict';
  // 复用旧版 Web 的完整游戏引擎（complete-v3 32 款 + deep-v2 6 款）。
  // Flutter 通过 startAirvanaGame(key, muted) 启动，事件经 GameBridge JS channel 回传。
  var DEEP_KEYS = ['star-mower', 'star-deck', 'adventurer-journal', 'idiom-detective', 'hex-frontier', 'garden-renewal'];
  var session = null;
  var currentKey = null;
  var currentMuted = true;

  function post(payload) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(payload));
      }
    } catch (error) { /* bridge unavailable: ignore */ }
  }

  function fitCanvas() {
    var canvas = document.getElementById('game');
    var scale = Math.min(window.innerWidth / 360, window.innerHeight / 560);
    canvas.style.width = Math.floor(360 * scale) + 'px';
    canvas.style.height = Math.floor(560 * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  function engineFor(key) {
    // 物理与 reference 玩法（101-105、111-118）都注册进 AirvanaPhysicsGames 容器，
    // 按注册表判断而不是维护一份 key 清单，避免与 Web 端漂移。
    if (window.AirvanaPhysicsGames && window.AirvanaPhysicsGames.has(key)) return window.AirvanaPhysicsGames;
    if (DEEP_KEYS.indexOf(key) >= 0) return window.AirvanaDeepGames;
    return window.AirvanaCompleteGames;
  }

  window.startAirvanaGame = function (key, muted) {
    var canvas = document.getElementById('game');
    var engine = engineFor(key);
    if (session && session.destroy) { try { session.destroy(); } catch (e) {} session = null; }
    if (!engine || !(engine.has ? engine.has(key) : true)) {
      var fallback = document.getElementById('boot-error');
      fallback.style.display = 'flex';
      fallback.textContent = '未找到游戏「' + key + '」的完整玩法定义。';
      post({type: 'error', message: 'game_not_found', key: key});
      return;
    }
    currentKey = key;
    currentMuted = muted === true || muted === 'true';
    document.getElementById('boot-error').style.display = 'none';
    try {
      session = engine.mount(canvas, key, {
        muted: currentMuted,
        reducedMotion: false,
        onComplete: function (result) {
          post({
            type: 'complete',
            key: currentKey,
            success: !!(result && result.success),
            score: result && typeof result.score === 'number' ? result.score : 0,
            stage: result && result.stage != null ? String(result.stage) : '',
            summary: result && result.summary ? String(result.summary) : ''
          });
        },
        onEvent: function (name, properties) {
          post({type: 'event', key: currentKey, name: String(name || ''), properties: properties || {}});
        },
        onStatus: function (status) {
          post({
            type: 'status',
            key: currentKey,
            paused: !!(status && status.paused),
            stage: status && status.stage != null ? String(status.stage) : '',
            score: status && typeof status.score === 'number' ? status.score : 0,
            text: status && status.text ? String(status.text) : ''
          });
        }
      });
      post({type: 'ready', key: key});
    } catch (error) {
      post({type: 'error', message: String(error && error.message || error), key: key});
    }
  };

  window.airvanaRunnerControl = {
    togglePause: function () { if (session && session.togglePause) session.togglePause(); },
    restart: function () { if (currentKey) window.startAirvanaGame(currentKey, currentMuted); },
    mute: function (value) {
      currentMuted = value === true || value === 'true';
      if (session && session.setMuted) session.setMuted(currentMuted);
    },
    destroy: function () { if (session && session.destroy) { try { session.destroy(); } catch (e) {} session = null; } }
  };

  post({type: 'boot', complete: !!window.AirvanaCompleteGames, deep: !!window.AirvanaDeepGames, physics: !!window.AirvanaPhysicsGames});
})();
</script>
</body>
</html>
